name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python telemetry agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Matches `npm test` / local: standard library unittest, no third-party deps.
      - name: Run test suite
        run: python -m unittest discover -s tests

  frontend-build:
    name: React/Vite frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      # Matches `npm run build` (vite build) used for production deploys.
      - name: Build frontend
        run: npm run build
