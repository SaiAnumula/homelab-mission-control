name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python telemetry agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax and warnings
        run: python -W error -m compileall -q agent tests
      # Standard library tests forbid real monitoring and subprocess operations.
      - name: Run test suite
        run: python -W error -m unittest discover -s tests

  frontend-build:
    name: React/Vite frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Typecheck frontend JavaScript and JSX
        run: npm run typecheck
      - name: Test telemetry and polling using mocks
        run: npm run test:node
      - name: Build frontend
        run: npm run build
