name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python telemetry agent tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax and warnings
        run: python -W error -m compileall -q agent deploy tests
      # Standard library tests forbid real monitoring and subprocess operations.
      - name: Run test suite
        run: python -W error -m unittest discover -s tests

  frontend-build:
    name: React/Vite frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Reject floating "latest" dependency pins
        run: |
          node -e '
            const pkg = require("./package.json");
            const bad = [
              ...Object.entries(pkg.dependencies || {}),
              ...Object.entries(pkg.devDependencies || {}),
            ].filter(([, v]) => v === "latest");
            if (bad.length) {
              console.error("Floating latest dependencies:", bad);
              process.exit(1);
            }
          '
      - name: Install dependencies
        run: npm ci
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Typecheck frontend JavaScript and JSX
        run: npm run typecheck
      - name: Test telemetry and polling using mocks
        run: npm run test:node
      - name: Build frontend
        run: npm run build
